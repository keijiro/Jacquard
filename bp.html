<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid sequencer</title>
<style>
  :root {
    --bg: #16161a;
    --note-line: #e8e8e4;
    --note-text: #f2f2ee;
    --marker: #9a9a96;
    --dot: #4e4e54;
    --ctrl-bg: #34343c;
    --ctrl-bg-hover: #44444e;
    --cell-w: 30px;
    --cell-h: 32px;
    --gap: 4px;
    --note-size: 15px;
    --len-size: 9px;
    --acc-gap: 5px;
    --acc-size: 0.62em;
    --acc-rise: 0.42em;
    --flow-dot: 2px;
    --flow-step: 7px;
    --link: #86868c;
    --link-w: 1px;
    --link-r: 6;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols, 18), var(--cell-w));
    grid-auto-rows: var(--cell-h);
    gap: var(--gap);
    padding: 18px;
  }
  .cell {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    border-radius: 5px;
    user-select: none;
  }
  .flow, .links {
    position: absolute;
    z-index: 0;
    pointer-events: none;
  }
  .flow {
    height: var(--flow-dot);
    transform: translateY(-50%);
    background-image: repeating-linear-gradient(to right,
      var(--note-line) 0 var(--flow-dot),
      transparent var(--flow-dot) var(--flow-step));
    opacity: 0.35;
  }
  .links {
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    fill: none;
    stroke: var(--link);
    stroke-width: var(--link-w);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .note {
    border: 1px solid var(--note-line);
    background: var(--bg);
    color: var(--note-text);
    font-size: var(--note-size);
    line-height: 1;
  }
  .label { white-space: nowrap; }
  .stack {
    display: grid;
    grid-template-rows: 1fr 1fr;
    place-items: center;
    width: 100%;
    height: 100%;
  }
  .len {
    font-size: var(--len-size);
    opacity: 0.7;
    letter-spacing: 0.02em;
  }
  .acc {
    position: relative;
    display: inline-block;
    width: var(--acc-gap);
    height: 1em;
    vertical-align: baseline;
    overflow: visible;
  }
  .acc > span {
    position: absolute;
    left: 50%;
    bottom: var(--acc-rise);
    transform: translateX(-50%);
    font-size: var(--acc-size);
    line-height: 1;
  }
  .linked { position: relative; }
  .linked::before {
    content: "";
    position: absolute;
    left: 50%;
    top: calc(-1 * var(--gap) - 1px);
    width: 1px;
    height: calc(var(--gap) + 2px);
    background: var(--note-line);
    transform: translateX(-50%);
  }
  .inv {
    background: var(--note-line);
    color: var(--bg);
  }
  .ctrl {
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .ctrl:not(.inv) { background: var(--ctrl-bg); }
  .marker { color: var(--marker); }
  .dot {
    color: var(--dot);
    font-size: 13px;
    line-height: 1;
  }
  .cell:not(.inv):hover { background: #ffffff14; }
  .ctrl:not(.inv):hover { background: var(--ctrl-bg-hover); }
  .inv:hover { background: #ffffff; }
</style>
</head>
<body>
<div id="grid"></div>
<script>
  const cols = 18, rows = 13;

  // lanes share one grid plane; each starts wherever it is placed and ends
  // with a TERM cell one column past its last step. a CHAN head makes a lane
  // an independent stream that runs alongside the others on that channel;
  // a JDST head makes it a branch target, reached only through a JUMP
  const lanes = [
    {
      // four steps against the main lane's sixteen: an accent every other
      // beat. a lock reaches whatever the channel sounds later in the same
      // instant, and later means further down the plane, so this lane is
      // placed above the one it colours
      x: 1, y: 1, head: "CHAN:1",
      steps: [
        ["PREL"],
        [],
        ["PREL"],
        []
      ]
    },
    {
      x: 1, y: 3, head: "CHAN:1",
      steps: [
        ["C4/4", "E4", "G4"],
        [],
        ["F#4/0.5"],
        ["PABS", "A4"],
        [],
        ["G4"],
        [],
        [],
        ["GCYC4:3", "F4", "PREL", "G#4/1.5", "C5"],
        ["GCYC4:4", "*JUMP"],
        ["A#4"],
        ["GPRB:35", "B4", "D5"],
        [],
        ["PREL", "E5/2"],
        [],
        []
      ]
    },
    {
      // a JDST lane records the one JUMP that reaches it, so the pairing is
      // one to one by construction: no JDST without a JUMP, and no two JUMPs
      // sharing a JDST
      x: 6, y: 9, head: "JDST", from: [10, 4],
      steps: [
        ["D#5", "C5", "G#4"],
        [],
        ["A#4/0.5"],
        ["GPRB:70", "G4"],
        ["F4"],
        []
      ]
    }
  ];

  const sharp = "\u266F";

  // How wide a row of boxes may run, taken from the cell rather than written out
  // again, so that changing the cell pitch cannot push the widest period past the
  // edges.
  const cellSpan = parseFloat(getComputedStyle(document.documentElement)
                              .getPropertyValue("--cell-w")) - 3;


  // GCYC: one box per pass through the loop, the firing one filled.
  // the period runs to 8, so the boxes narrow as it grows to keep the row
  // inside the cell; below 5 they stay at their full width
  function cycle(period, nth) {
    const h = 8;
    const gap = period > 6 ? 1 : 2;
    const w = Math.min(5, Math.floor((cellSpan + gap) / period) - gap);
    const total = period * (w + gap) - gap + 1;
    let rects = "";
    for (let i = 0; i < period; i++) {
      const x = i * (w + gap) + 0.5;
      const paint = i === nth - 1
        ? 'fill="currentColor"'
        : 'fill="none" stroke="currentColor"';
      rects += '<rect x="' + x + '" y="0.5" width="' + w +
               '" height="' + h + '" ' + paint + '/>';
    }
    return '<svg width="' + total + '" height="' + (h + 1) +
           '" viewBox="0 0 ' + total + ' ' + (h + 1) +
           '" shape-rendering="crispEdges" aria-hidden="true">' + rects + '</svg>';
  }

  // GPRB: the firing chance as a filled wedge, from a percentage
  function prob(percent) {
    const c = 5.5, r = 5;
    const a = (percent / 100) * Math.PI * 2;
    const x = (c + r * Math.sin(a)).toFixed(2);
    const y = (c - r * Math.cos(a)).toFixed(2);
    const large = percent > 50 ? 1 : 0;
    const ring = '<circle cx="' + c + '" cy="' + c + '" r="' + r + '"';
    const wedge = percent >= 100
      ? ring + ' fill="currentColor"/>'
      : '<path d="M' + c + ' ' + c + ' L' + c + ' ' + (c - r) +
        ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x + ' ' + y +
        ' Z" fill="currentColor"/>';
    return '<svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">' +
           wedge + ring + ' fill="none" stroke="currentColor"/></svg>';
  }

  // 1px strokes on half-integer coordinates, matching cycle() and prob()
  const ICON = 15;
  const ICON_TOP = 1.5, ICON_BOTTOM = 13.5;

  function svgIcon(body) {
    return '<svg width="' + ICON + '" height="' + ICON +
           '" viewBox="0 0 ' + ICON + ' ' + ICON +
           '" fill="none" stroke="currentColor" stroke-linecap="round"' +
           ' stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  function line(x1, y1, x2, y2) {
    return '<path d="M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2 + '"/>';
  }

  function chevron(cx, tipY, baseY, hw) {
    return '<path d="M' + (cx - hw) + ' ' + baseY + 'L' + cx + ' ' + tipY +
           'L' + (cx + hw) + ' ' + baseY + '"/>';
  }

  // flow runs right along the top, turns back on itself and exits left.
  // the head is a solid triangle, like the markers it sits among on the rail
  function uTurn(y0, y1, xr) {
    const r = (y1 - y0) / 2;
    return line(2.5, y0, xr, y0) +
           '<path d="M' + xr + ' ' + y0 + 'A' + r + ' ' + r + ' 0 0 1 ' +
           xr + ' ' + y1 + '"/>' +
           line(xr, y1, 4.4, y1) +
           arrowHead(2, 5, y1, 2.4);
  }

  function arrowHead(tipX, baseX, cy, hw) {
    return '<path d="M' + tipX + ' ' + cy + 'L' + baseX + ' ' + (cy - hw) +
           'L' + baseX + ' ' + (cy + hw) + 'Z" fill="currentColor"' +
           ' stroke="none"/>';
  }

  // Z-shaped arrow rounded off at both turns: the sequence leaves this lane
  function zigzag() {
    const y0 = 3.5, y1 = 10.5, x0 = 2.5, x1 = 10.5, x2 = 4.5, x3 = 10.4;
    const r = 1.7;
    const len = Math.hypot(x2 - x1, y1 - y0);
    const ux = (x2 - x1) / len * r, uy = (y1 - y0) / len * r;
    return '<path d="M' + x0 + ' ' + y0 +
           'L' + (x1 - r).toFixed(2) + ' ' + y0 +
           'Q' + x1 + ' ' + y0 + ' ' + (x1 + ux).toFixed(2) + ' ' +
           (y0 + uy).toFixed(2) +
           'L' + (x2 - ux).toFixed(2) + ' ' + (y1 - uy).toFixed(2) +
           'Q' + x2 + ' ' + y1 + ' ' + (x2 + r).toFixed(2) + ' ' + y1 +
           'L' + x3 + ' ' + y1 + '"/>' +
           arrowHead(x3 + 3, x3, y1, 2.2);
  }

  // arrow rising out of a bar: where a jump lands and a lane begins
  function entry() {
    const cy = 7.5, x = 2.5;
    return line(x, 3.5, x, 11.5) +
           line(x, cy, 10.4, cy) +
           arrowHead(13.4, 10.4, cy, 2.2);
  }

  function fader(cx, cy) {
    const kw = 6, kh = 3;
    const top = cy - kh / 2, bottom = cy + kh / 2;
    return line(cx, ICON_TOP, cx, top) +
           line(cx, bottom, cx, ICON_BOTTOM) +
           '<rect x="' + (cx - kw / 2) + '" y="' + top +
           '" width="' + kw + '" height="' + kh + '" rx="1"/>';
  }

  function upDown(cx) {
    const hw = 2, hh = 2.8;
    return line(cx, ICON_TOP, cx, ICON_BOTTOM) +
           chevron(cx, ICON_TOP, ICON_TOP + hh, hw) +
           chevron(cx, ICON_BOTTOM, ICON_BOTTOM - hh, hw);
  }

  const icons = {
    PABS: svgIcon(fader(7.5, 6)),
    PREL: svgIcon(fader(4.5, 6) + upDown(11.5)),
    TERM: svgIcon(uTurn(2.5, 10.5, 9.5)),
    JUMP: svgIcon(zigzag()),
    JDST: svgIcon(entry())
  };

  function render(cell, value) {
    if (value.charAt(0) === "*") {
      cell.classList.add("inv");
      value = value.slice(1);
    }
    if (icons[value]) {
      cell.classList.add("ctrl");
      cell.innerHTML = icons[value];
      return;
    }
    const c = /^CHAN:(\d+)$/.exec(value);
    if (c) {
      cell.classList.add("ctrl");
      cell.innerHTML = '<span class="label">CH' + c[1] + '</span>';
      return;
    }
    const p = /^GPRB:([\d.]+)$/.exec(value);
    if (p) {
      cell.classList.add("ctrl");
      cell.innerHTML = prob(Number(p[1]));
      return;
    }
    const b = /^GCYC(\d+):(\d+)$/.exec(value);
    if (b) {
      cell.classList.add("ctrl");
      cell.innerHTML = cycle(Number(b[1]), Number(b[2]));
      return;
    }
    const m = /^([A-G])(#?)(-?\d+)(?:\/([\d.]+))?$/.exec(value);
    if (!m) {
      cell.classList.add("ctrl");
      cell.innerHTML = '<span class="label">' + value + '</span>';
      return;
    }
    const acc = m[2] ? '<span>' + sharp + '</span>' : '';
    const label = '<span class="label">' + m[1] +
      '<span class="acc">' + acc + '</span>' + m[3] + '</span>';

    if (m[4] === undefined) {
      cell.innerHTML = label;
    } else {
      cell.innerHTML = '<span class="stack">' + label +
        '<span class="len">' + m[4] + '</span></span>';
    }
  }

  const triangle =
    '<svg width="7" height="9" viewBox="0 0 7 9" aria-hidden="true">' +
    '<path d="M0 0 L7 4.5 L0 9 Z" fill="currentColor"/></svg>';

  function valueAt(x, y) {
    for (let i = 0; i < lanes.length; i++) {
      const lane = lanes[i];
      if (y === lane.y && lane.head && x === lane.x - 1) return "*" + lane.head;
      if (y === lane.y && x === lane.x + lane.steps.length) return "*TERM";
      // a step's stack is as deep as it needs to be; a lane occupies only
      // the cells it fills, not a rectangle
      const sx = x - lane.x, sy = y - lane.y;
      if (sx >= 0 && sx < lane.steps.length && sy >= 0 &&
          sy < lane.steps[sx].length) {
        return lane.steps[sx][sy] || null;
      }
    }
    return null;
  }

  // true on a lane's own rail row, where an empty step shows a marker
  function onRail(x, y) {
    for (let i = 0; i < lanes.length; i++) {
      const lane = lanes[i], sx = x - lane.x;
      if (y === lane.y && sx >= 0 && sx < lane.steps.length) return true;
    }
    return false;
  }

  const grid = document.getElementById("grid");
  grid.style.setProperty("--cols", cols);
  const frag = document.createDocumentFragment();

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.x = x;
      cell.dataset.y = y;

      const note = valueAt(x, y);

      if (note) {
        cell.classList.add("note");
        render(cell, note);
        cell.setAttribute("aria-label", note.replace(/^\*/, ""));
        if (valueAt(x, y - 1)) cell.classList.add("linked");
      } else if (onRail(x, y)) {
        cell.classList.add("marker");
        cell.innerHTML = triangle;
      } else {
        cell.classList.add("dot");
        cell.textContent = "\u30FB";
      }
      frag.appendChild(cell);
    }
  }
  grid.appendChild(frag);

  function center(x, y) {
    const cell = grid.querySelector('[data-x="' + x + '"][data-y="' + y + '"]');
    return {
      x: cell.offsetLeft + cell.offsetWidth / 2,
      y: cell.offsetTop + cell.offsetHeight / 2
    };
  }

  for (let i = 0; i < lanes.length; i++) {
    const lane = lanes[i];
    const a = center(lane.head ? lane.x - 1 : lane.x, lane.y);
    const b = center(lane.x + lane.steps.length, lane.y);
    const rail = document.createElement("div");
    rail.className = "flow";
    rail.style.left = Math.min(a.x, b.x) + "px";
    rail.style.top = a.y + "px";
    rail.style.width = Math.abs(b.x - a.x) + "px";
    grid.appendChild(rail);
  }

  // links run off-axis, nudged right of the column centres and below the row
  // centres, so they read as a separate layer from the rails they cross. the
  // half-pixel keeps the 1px stroke on a pixel boundary
  const linkOff = 7.5;

  function toward(from, to, d) {
    const dx = to[0] - from[0], dy = to[1] - from[1];
    const len = Math.hypot(dx, dy) || 1;
    const t = Math.min(d, len / 2) / len;
    return [from[0] + dx * t, from[1] + dy * t];
  }

  function roundedPath(pts, r) {
    function at(q) {
      return q[0].toFixed(1) + " " + q[1].toFixed(1);
    }
    let d = "M" + at(pts[0]);
    for (let i = 1; i < pts.length - 1; i++) {
      d += "L" + at(toward(pts[i], pts[i - 1], r)) +
           "Q" + at(pts[i]) + " " + at(toward(pts[i], pts[i + 1], r));
    }
    return d + "L" + at(pts[pts.length - 1]);
  }

  const ns = "http://www.w3.org/2000/svg";
  const layer = document.createElementNS(ns, "svg");
  layer.setAttribute("class", "links");

  // route each link down out of its JUMP cell, across the empty row above
  // the target lane, then down into that lane's JDST cell
  for (let i = 0; i < lanes.length; i++) {
    const lane = lanes[i];
    if (!lane.from) continue;
    const a = center(lane.from[0], lane.from[1]);
    const b = center(lane.x - 1, lane.y);
    const midY = center(lane.x - 1, lane.y - 1).y + linkOff;
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", roundedPath([
      [a.x + linkOff, a.y],
      [a.x + linkOff, midY],
      [b.x + linkOff, midY],
      [b.x + linkOff, b.y]
    ], Number(getComputedStyle(grid).getPropertyValue("--link-r"))));
    layer.appendChild(path);
  }
  grid.appendChild(layer);
</script>
</body>
</html>
